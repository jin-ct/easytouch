name: Sync Release To Gitee

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir assets

          gh release download \
            "$RELEASE_TAG" \
            -D assets
        
      - name: Create Gitee Release
        # 固定到具体提交，避免第三方 Action 分支被篡改后窃取 GITEE_TOKEN
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722
        with:
          gitee_action: create_release
          gitee_owner: jin-ct
          gitee_repo: easytouch
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_target_commitish: ${{ github.event.release.target_commitish }}
          gitee_tag_name: ${{ github.event.release.tag_name }}
          gitee_release_name: ${{ github.event.release.name }}
          gitee_release_body: ${{ github.event.release.body }}

      - name: Upload Assets
        uses: nicennnnnnnlee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722
        with:
          gitee_action: upload_asset
          gitee_owner: jin-ct
          gitee_repo: easytouch
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.release.tag_name }}
          gitee_upload_retry_times: 3
          gitee_files: assets/*
