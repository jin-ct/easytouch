name: Unit Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt6 and build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          qt6-base-dev \
          qt6-declarative-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev

    - name: Configure
      run: cmake -S tests -B tests/build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build tests/build --parallel

    - name: Run tests
      working-directory: tests/build
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --output-on-failure
